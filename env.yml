name: smart
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24.2
  - git-lfs
  # (不装 conda 的 pytorch/cudatoolkit，避免与 pip 轮子冲突)
  - pip:
      # ---- PyTorch 三件套（CUDA 12.6 轮子）----
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.6.0+cu126
      - torchvision==0.21.0+cu126
      - torchaudio==2.6.0+cu126

      # ---- vLLM 与 HF 生态 ----
      - vllm==0.8.5
      - transformers>=4.55
      - datasets>=2.20
      - accelerate>=0.33
      - huggingface_hub>=0.23
      - tokenizers>=0.21
      - sentencepiece>=0.2

      # ---- 实用依赖 ----
      - pyyaml>=6.0
      - tqdm>=4.66
      - evaluate>=0.4
      - jsonlines
      - tyro
      - rich
