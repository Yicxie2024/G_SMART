# refer to src/sal/config.py for more options
model_path: meta-llama/Llama-3.1-8B-Instruct
draft_model_path: /storage/ukp/shared/shared_model_weights/models--meta-llama--Llama-3.2-1B-Instruct
#custom_chat_template: null
filter_duplicates: true
approach: beam_search
search_batch_size: 1  # DO NOT CHANGE!
num_iterations: 40
seed: 0
smart_search: true
n: 16
# specify n
# specify beam_width
# specify score_method: default is prm
