# refer to src/sal/config.py for more options
model_path: meta-llama/Llama-3.1-8B-Instruct
draft_model_path: /storage/ukp/shared/shared_model_weights/models--meta-llama--Llama-3.2-1B-Instruct
custom_chat_template: null
filter_duplicates: true
approach: beam_search
search_batch_size: 1  # DO NOT CHANGE!
num_iterations: 40
seed: 0
smart_search: true
n: 1
beam_width: 16
uq_threshold: 0.1
uq_sampling_temperature: 1.5
top_k: 50
use_default_beam_search: true
score_method: cocoa_msp
dataset_start: 0
dataset_end: 10

# Baseline comparison settings
run_slm_baseline: true       # Set to false to skip SLM-only baseline
run_random_baseline: true    # Set to false to skip random correction baseline

# specify n
# specify beam_width
# specify score_method: default is prm
#   if 'conf', specify conf_strategy: default is probs_mean